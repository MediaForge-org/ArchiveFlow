[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/task-engine",
  "crates/archive",
  "crates/storage",
  "crates/media-probe",
  "crates/thumbnail",
  "crates/hashing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/MediaForge-org/ArchiveFlow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
